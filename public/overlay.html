<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Оверлей</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
:root{
  --gold:#c9a45c; --gold2:#f2dca4; --gold3:#6d5a2e;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Cormorant Garamond","Times New Roman",serif;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
html,body{margin:0; background:transparent; overflow:hidden; width:100%; height:100%}
#cv{position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; font-family:var(--f-body); color:#fff}
.cut{position:absolute; background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--gold3)); clip-path:var(--cut)}
.cut > .in{position:absolute; inset:2px; clip-path:var(--cut); background:linear-gradient(180deg,#181d25,#0a0c10); display:flex; align-items:center}
.sb{position:absolute; left:0; top:36px; width:100%; height:96px; filter:drop-shadow(0 14px 26px rgba(0,0,0,.55)); transition:opacity .5s, transform .5s}
.sb .cut{top:0; height:96px}
.t{width:320px} .s{width:88px} .m{width:170px}
#pA{left:455px} #sA{left:781px} #mC{left:875px} #sB{left:1051px} #pB{left:1145px}
.sb.hide{opacity:0; transform:translateY(-24px)}
.team .in{gap:14px; padding:0 20px}
.team.r .in{flex-direction:row-reverse; text-align:right}
.logo{flex:none; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:20px; letter-spacing:.04em;
  background:radial-gradient(circle at 30% 25%,#2b3340,#0e1117); border:2px solid var(--gold); color:var(--gold2)}
.logo{overflow:hidden}
.logo img{width:80%; height:80%; object-fit:contain; display:block}
.tn{flex:1; min-width:0; font-weight:800; font-size:22px; letter-spacing:.07em; text-transform:uppercase; overflow:hidden; white-space:normal; line-height:1.12; overflow-wrap:anywhere}
.score .in{justify-content:center; font-size:58px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold2)}
.score .in span{display:inline-block}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.6); opacity:.2}100%{transform:none; opacity:1}}
.mid .in{flex-direction:column; justify-content:center; gap:2px; text-align:center}
.mid b{font-size:16px; letter-spacing:.3em; color:var(--gold); font-weight:700}
.mid i{font-style:normal; font-size:21px; font-weight:700; letter-spacing:.14em}
.timer{left:40px; top:36px; width:360px; height:96px; filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
.timer .in{flex-direction:column; justify-content:center; align-items:flex-start; padding:0 24px; gap:0}
.timer small{font-size:14px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); font-weight:700}
.timer strong{font-size:50px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.04em; line-height:1.05}
.timer.zero strong{animation:pulse 1s infinite}
@keyframes pulse{50%{color:var(--gold2); opacity:.55}}
.cam{position:absolute; right:40px; top:36px; width:400px; height:225px}
.cam i{position:absolute; width:34px; height:34px; border:3px solid var(--gold)}
.cam i:nth-of-type(1){left:-6px; top:-6px; border-right:0; border-bottom:0}
.cam i:nth-of-type(2){right:-6px; top:-6px; border-left:0; border-bottom:0}
.cam i:nth-of-type(3){left:-6px; bottom:-6px; border-right:0; border-top:0}
.cam i:nth-of-type(4){right:-6px; bottom:-6px; border-left:0; border-top:0}
.plate{right:40px; top:270px; width:400px; height:46px}
.plate .in{justify-content:center; font-weight:800; font-size:19px; letter-spacing:.34em; text-transform:uppercase}
.lt{left:40px; bottom:104px; width:600px; height:116px; transform:translateX(-120%); transition:transform .7s cubic-bezier(.2,.9,.2,1); filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
.lt.on{transform:none}
.lt .in{flex-direction:column; justify-content:center; align-items:flex-start; padding:0 32px; gap:4px}
.lt strong{font-size:40px; font-weight:800; letter-spacing:.05em; line-height:1.1}
.lt span{font-size:18px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); font-weight:700}
.tick{position:absolute; left:0; right:0; bottom:0; height:60px; display:flex; align-items:center; gap:28px; padding-right:40px;
  background:linear-gradient(180deg,rgba(10,12,16,.9),rgba(6,8,10,.97)); border-top:2px solid var(--gold3)}
.tick .tag{height:100%; padding:0 40px; display:flex; align-items:center; background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#14100a;
  font-weight:800; font-size:20px; letter-spacing:.2em; text-transform:uppercase}
.tick .sep{width:2px; height:24px; background:var(--gold3)}
.tick .tx{font-size:20px; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:#ddd7c8}
.tick .game-name{margin-left:auto; font-family:var(--f-serif); font-style:italic; font-size:28px; color:var(--gold); letter-spacing:.04em; text-transform:none; font-weight:600}
.scene{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;
  background:radial-gradient(70% 80% at 50% 45%, #0c1016, #050608); opacity:0; pointer-events:none; transition:opacity .6s}
.scene.on{opacity:1}
.scene h2{margin:0; font-size:112px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; padding-left:.2em}
.scene .sub{font-family:var(--f-serif); font-style:italic; font-size:50px; color:var(--gold); font-weight:600}
.scene .big{font-size:230px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.04em; line-height:1; margin-top:10px;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,var(--gold3)); -webkit-background-clip:text; background-clip:text; color:transparent}
.scene .line{width:520px; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:6px 0}
.bscene{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .6s}
.bbg{position:absolute; background:#080b10}
.blinks{position:absolute; left:0; top:0; width:1920px; height:1080px}
.lk{position:absolute; background:var(--gold3); transform-origin:0 0; transform:scaleX(0); will-change:transform; transition:transform .2s}
.lk.v{transform:scaleY(0)}
.lk.vu{transform-origin:0 100%}
.bscene.on .lk{transform:none; transition:transform .28s ease-out var(--d,.9s)}
.bscene.on{opacity:1}
.bt{position:absolute; left:40px; top:44px}
.bt h2{margin:0; font-size:76px; font-weight:800; letter-spacing:.16em; text-transform:uppercase}
.bt p{margin:6px 0 0; font-family:var(--f-serif); font-style:italic; font-size:42px; color:var(--gold); font-weight:600}
.bh{position:absolute; width:400px; height:44px; display:grid; place-items:center; background:rgba(255,255,255,.05);
  border-bottom:2px solid var(--gold3); font-size:17px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color:var(--gold)}
.bm{width:400px; height:112px; will-change:transform,opacity}
.bm .in{flex-direction:column; align-items:stretch; padding:0; gap:0}
.br{flex:1; display:flex; align-items:center; justify-content:space-between; padding:0 0 0 20px; min-width:0}
.br + .br{border-top:1px solid rgba(255,255,255,.09)}
.bl{flex:none; width:42px; height:42px; border-radius:50%; margin-right:14px; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 30% 25%,#2b3340,#0e1117); border:1.5px solid var(--gold3);
  font-size:13px; font-weight:800; letter-spacing:.04em; color:var(--gold2); font-style:normal}
.bl img{width:82%; height:82%; object-fit:contain; display:block}
.bl.tbd{opacity:.4}
.bn{flex:1; font-size:26px; font-weight:600; letter-spacing:.04em; white-space:normal; line-height:1.1; overflow:hidden; overflow-wrap:anywhere; min-width:0}
.bn.empty{color:rgba(255,255,255,.3)}
.bs{width:72px; align-self:stretch; display:grid; place-items:center; font-weight:800; font-size:34px; font-variant-numeric:tabular-nums; background:rgba(255,255,255,.05)}
.br.win .bn{font-weight:800; color:#fff}
.br.win .bs{color:var(--gold2); background:rgba(201,164,92,.2)}
.br.lose{opacity:.55}
.scene .res{font-size:30px; letter-spacing:.24em; text-transform:uppercase; font-weight:600; color:#d9d3c4}

/* ---------- плавные переходы между сценами ---------- */
.scene > *{opacity:0; transform:translateY(26px); transition:opacity .3s, transform .3s}
.scene.on > *{opacity:1; transform:none; transition:opacity .7s ease, transform .9s cubic-bezier(.2,.9,.2,1)}
.scene.on > :nth-child(1){transition-delay:.15s}
.scene.on > :nth-child(2){transition-delay:.3s}
.scene.on > :nth-child(3){transition-delay:.42s; transform:none}
.scene > .line{transform:scaleX(0)}
.scene.on > .line{transform:scaleX(1)}
.scene.on > :nth-child(4){transition-delay:.5s}
.scene.on > :nth-child(5){transition-delay:.65s}

.bh{position:absolute; box-sizing:border-box; padding:0 84px 0 14px; font-size:15px; letter-spacing:.1em; text-align:center} .bh span{white-space:nowrap} .bh em{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-style:normal; font-size:15px; font-weight:800; letter-spacing:.08em; padding:3px 8px; border:1px solid var(--gold); color:var(--gold); background:rgba(0,0,0,.35)}
.bscene .bh, .bscene .bm{opacity:0; transform:translateY(22px); transition:opacity .3s, transform .3s}
.bscene.on .bh, .bscene.on .bm{opacity:1; transform:none;
  transition:opacity .55s ease var(--d,0s), transform .75s cubic-bezier(.2,.9,.2,1) var(--d,0s)}
.bscene .bt{opacity:0; transform:translateX(-36px); transition:opacity .3s, transform .3s}
.bscene.on .bt{opacity:1; transform:none; transition:opacity .6s ease .1s, transform .8s cubic-bezier(.2,.9,.2,1) .1s}

.sweep{position:absolute; top:-120px; bottom:-120px; left:0; width:360px; pointer-events:none; opacity:0;
  background:linear-gradient(90deg, transparent 0%, rgba(201,164,92,.10) 18%, rgba(201,164,92,.55) 42%, rgba(255,255,255,.9) 50%, rgba(201,164,92,.55) 58%, rgba(201,164,92,.10) 82%, transparent 100%);
  will-change:transform,opacity; transform:translateX(-460px) skewX(-14deg)}
.sweep.go{animation:sweep 1.05s cubic-bezier(.55,0,.25,1) both}
@keyframes sweep{
  0%{opacity:0; transform:translateX(-460px) skewX(-14deg)}
  12%{opacity:.5}
  88%{opacity:.5}
  100%{opacity:0; transform:translateX(2120px) skewX(-14deg)}
}
@media (prefers-reduced-motion: reduce){
  .scene > *, .bscene .bh, .bscene .bm, .bscene .bt{transform:none !important}
  .sweep{display:none}
}

/* ---------- стиль «чемпионат»: тёмно-синий, голубое свечение, серебряная кромка ---------- */
:root{
  --glow:rgba(77,163,255,.5);
  --cut:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  --f-head:"Cinzel","Cormorant Garamond","Times New Roman",serif;
}
.cut{background:linear-gradient(135deg,#f4f8ff,var(--gold) 34%,var(--gold3) 66%,#aebcd2)}
.cut > .in{background:linear-gradient(180deg,#13265a 0%,#0b1738 52%,#060d20 100%); box-shadow:inset 0 1px 0 rgba(170,205,255,.28), inset 0 -18px 28px rgba(40,100,220,.12)}
.sb,.timer,.lt{filter:drop-shadow(0 0 16px var(--glow)) drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.logo,.bl{background:radial-gradient(circle at 30% 25%,#27458c,#0a1226); color:var(--gold2)}
.logo{border-color:var(--gold); box-shadow:0 0 12px var(--glow)}
.bl{border-color:var(--gold3)}
.score .in{color:#fff; text-shadow:0 0 18px var(--glow),0 0 4px rgba(255,255,255,.6); background:linear-gradient(180deg,#1a3a86,#0b1a40)}
.mid .in{background:linear-gradient(180deg,#0f2150,#070f26)}
.mid b{color:var(--gold2)}
.tn{text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cam i{border-color:var(--gold); filter:drop-shadow(0 0 6px var(--glow))}
.plate .in{color:var(--gold2); text-shadow:0 0 10px var(--glow)}
.timer small,.lt span{color:var(--gold2)}
.timer strong{text-shadow:0 0 14px var(--glow)}
.tick{background:linear-gradient(180deg,#0b1936,#050a18); border-top:2px solid var(--gold); box-shadow:0 -6px 26px var(--glow)}
.tick .tag{background:linear-gradient(135deg,var(--gold2),var(--gold)); color:#04122a}
.tick .sep{background:var(--gold3)}
.tick .tx{color:#cfe0f7}
.tick .game-name{font-family:var(--f-head); font-style:normal; color:var(--gold2); letter-spacing:.08em; font-weight:700; font-size:24px}
.scene{background:
  radial-gradient(55% 60% at 50% 36%, rgba(70,140,240,.38), transparent 72%),
  radial-gradient(40% 30% at 50% 100%, rgba(90,160,255,.30), transparent 80%),
  linear-gradient(180deg,#070d22 0%,#0a1a3c 58%,#04070f 100%)}
.scene::before{content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(105deg, transparent 0 190px, rgba(120,175,255,.06) 190px 192px),
             linear-gradient(0deg, rgba(80,150,255,.20), transparent 32%)}
.scene::after{content:''; position:absolute; left:0; right:0; bottom:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); box-shadow:0 0 24px 4px var(--glow)}
.scene > *{position:relative; z-index:1}
.scene h2{font-family:var(--f-head); font-weight:800; letter-spacing:.07em; padding-left:.07em;
  background:linear-gradient(180deg,#ffffff 0%,#dbe4f2 42%,#8795ad 54%,#eef3fb 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 22px var(--glow)) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.scene .sub{font-family:var(--f-body); font-style:normal; font-size:34px; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:var(--gold2); padding-left:.3em}
.scene .big{background:linear-gradient(180deg,#ffffff,#bcd8ff 55%,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 26px var(--glow)); font-family:var(--f-body)}
.scene .line{background:linear-gradient(90deg,transparent,var(--gold),transparent); box-shadow:0 0 16px var(--glow)}
.scene .res{color:#cfe0f7}
.bbg{background:#060b18}
.lk{background:var(--gold); box-shadow:0 0 10px var(--glow)}
.bt h2{font-family:var(--f-head); font-weight:800; letter-spacing:.08em;
  background:linear-gradient(180deg,#ffffff,#dbe4f2 45%,#8795ad 55%,#eef3fb); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 16px var(--glow))}
.bt p{font-family:var(--f-body); font-style:normal; font-size:24px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold2); font-weight:600}
.bh{background:linear-gradient(180deg,rgba(77,163,255,.16),rgba(77,163,255,.05)); border-bottom:2px solid var(--gold); color:var(--gold2); box-shadow:0 6px 18px -8px var(--glow)}
.bh em{border-color:var(--gold); color:var(--gold2); background:rgba(5,12,32,.6)}
.br + .br{border-top:1px solid rgba(130,180,255,.2)}
.bs{background:rgba(77,163,255,.1)}
.br.win .bs{color:#fff; background:rgba(77,163,255,.38); text-shadow:0 0 12px var(--glow)}
.sweep{background:linear-gradient(90deg, transparent 0%, rgba(77,163,255,.10) 18%, rgba(77,163,255,.5) 42%, rgba(255,255,255,.9) 50%, rgba(77,163,255,.5) 58%, rgba(77,163,255,.10) 82%, transparent 100%)}

/* ---------- ближе к референсу: зал, герб, табло с гербом, перерыв ---------- */
.emb-s{width:36px; height:36px; flex:none; filter:drop-shadow(0 0 8px var(--glow))}
.emb-l{position:absolute; left:50%; top:62px; width:150px; height:150px; margin-left:-75px; filter:drop-shadow(0 0 26px var(--glow)) drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.sart{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .6s; overflow:hidden;
  background:radial-gradient(60% 55% at 50% 34%, rgba(70,140,240,.40), transparent 72%), linear-gradient(180deg,#050a1c 0%,#08162f 55%,#03060e 100%)}
.sart.on{opacity:1}
.sart svg:first-child{position:absolute; left:0; top:0}
.dust{position:absolute; width:6px; height:6px; border-radius:50%; background:#bfe0ff; opacity:0; box-shadow:0 0 10px 2px var(--glow); animation:dust var(--t) linear infinite; will-change:transform,opacity}
@keyframes dust{0%{opacity:0; transform:translate(0,0)}15%{opacity:.8}85%{opacity:.5}100%{opacity:0; transform:translate(var(--x),-240px)}}
.scene{background:none}
.scene::before{background:none}
.scene h2{margin-top:110px}
.scene.isbreak h2{margin-top:70px}
.scene.isbreak .big{font-size:150px}
.scene .big{font-size:200px}
.bkp{display:none; align-items:center; gap:22px; margin-top:6px; padding:12px 40px; background:linear-gradient(180deg,#13265a,#070f26); border:2px solid var(--gold); clip-path:var(--cut); filter:drop-shadow(0 0 16px var(--glow))}
.scene.isbreak .bkp{display:flex}
.scene.on > :nth-child(6){transition-delay:.8s}
.bkn{width:330px; font-size:30px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; text-align:left; line-height:1.1; overflow-wrap:anywhere}
.bkn.r{text-align:right}
.bkl{flex:none; width:68px; height:68px; border-radius:50%; display:grid; place-items:center; overflow:hidden; font-weight:800; font-size:22px; background:radial-gradient(circle at 30% 25%,#27458c,#0a1226); border:2px solid var(--gold); color:var(--gold2)}
.bkl img{width:80%; height:80%; object-fit:contain}
.bks{font-size:64px; font-weight:800; min-width:56px; text-shadow:0 0 16px var(--glow); font-variant-numeric:tabular-nums}
.bkd{font-style:normal; font-size:50px; color:var(--gold2)}
.scene .res{padding:10px 34px; margin-top:6px; border:1px solid var(--gold3); background:rgba(8,20,48,.6); font-size:22px; letter-spacing:.28em}
/* табло: скошенные крылья и герб по центру */
#pA{clip-path:none}
.team.t:not(.r){--cut:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.team.t.r{--cut:polygon(0 0,100% 0,100% 100%,26px 100%)}
.team.t .in{padding:0 36px 0 22px}
.team.t.r .in{padding:0 22px 0 36px}
.score{--cut:polygon(0 0,100% 0,100% 100%,0 100%)}
.mid{height:136px !important; --cut:polygon(0 0,100% 0,100% 62%,calc(100% - 26px) 100%,26px 100%,0 62%)}
.mid .in{padding-top:6px; gap:0; justify-content:flex-start; padding-top:14px}
.mid b{font-size:15px; letter-spacing:.22em}
.mid i{font-size:15px; letter-spacing:.12em; color:#cfe0f7}
/* LIVE */
.live{position:absolute; right:40px; top:36px; transform:translate(-308px,14px); display:flex; align-items:center; gap:8px; padding:5px 12px; font-size:15px; font-weight:800; letter-spacing:.18em; background:rgba(5,10,24,.78); border:1px solid var(--gold3); color:#fff}
.live b{width:10px; height:10px; border-radius:50%; background:#ff4157; box-shadow:0 0 10px #ff4157; animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.bbg{background:#050a18}
</style>
</head>
<body>
<div id="cv">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#b9c6dc"/><stop offset="1" stop-color="#5f7396"/></linearGradient>
  <symbol id="crest" viewBox="0 0 100 100">
    <path d="M50 4 L61 28 L50 96 L39 28 Z" fill="url(#gs)"/>
    <path d="M37 34 C26 30 14 33 3 14 C6 42 20 58 38 66 Z" fill="url(#gs)" opacity=".92"/>
    <path d="M63 34 C74 30 86 33 97 14 C94 42 80 58 62 66 Z" fill="url(#gs)" opacity=".92"/>
    <path d="M40 70 C30 74 20 72 12 66 C20 80 32 86 44 84 Z M60 70 C70 74 80 72 88 66 C80 80 68 86 56 84 Z" fill="url(#gs)" opacity=".75"/>
  </symbol>
</defs></svg>
  <div class="sb" id="sb">
    <div class="cut team t" id="pA"><div class="in"><div class="logo" id="lgA"></div><div class="tn" id="tnA"></div></div></div>
    <div class="cut score s" id="sA"><div class="in"><span id="scA">0</span></div></div>
    <div class="cut mid m" id="mC"><div class="in"><svg class="emb-s" viewBox="0 0 100 100"><use href="#crest"/></svg><b id="boT"></b><i id="mapT"></i></div></div>
    <div class="cut score s" id="sB"><div class="in"><span id="scB">0</span></div></div>
    <div class="cut team t r" id="pB"><div class="in"><div class="logo" id="lgB"></div><div class="tn" id="tnB"></div></div></div>
  </div>
  <div class="cut timer" id="timer"><div class="in"><small id="tLabel"></small><strong id="tVal">05:00</strong></div></div>
  <div class="cam"><i></i><i></i><i></i><i></i></div>
  <div class="live"><b></b>LIVE</div>
  <div class="cut plate"><div class="in" id="camName"></div></div>
  <div class="cut lt" id="lt"><div class="in"><strong id="ltName"></strong><span id="ltRole"></span></div></div>
  <div class="tick"><div class="tag" id="tkTour"></div><div class="tx" id="tkStage"></div><div class="sep"></div><div class="tx">Прямой эфир</div><div class="tx game-name">Mobile Legends: Bang Bang</div></div>
  <div class="bscene" id="bscene">
    <div class="bbg" style="left:0;top:0;width:1920px;height:24px"></div>
    <div class="bbg" style="left:0;top:272px;width:1920px;height:808px"></div>
    <div class="bbg" style="left:0;top:20px;width:1466px;height:256px"></div>
    <div class="bbg" style="left:1894px;top:20px;width:26px;height:256px"></div>
    <div class="blinks" id="blinks" aria-hidden="true"></div>
    <div class="bt"><h2 id="bTitle"></h2><p id="bTour"></p></div>
  </div>
  <div class="sart" id="sart" aria-hidden="true">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
      <defs>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".30"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="pil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050a1a"/><stop offset=".85" stop-color="#0d2046"/><stop offset="1" stop-color="#3d78d0"/></linearGradient>
        <linearGradient id="pilr" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#050a1a"/><stop offset=".85" stop-color="#0d2046"/><stop offset="1" stop-color="#3d78d0"/></linearGradient>
        <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ff" stop-opacity=".45"/><stop offset=".55" stop-color="#4f95ff" stop-opacity=".35"/><stop offset="1" stop-color="#0a1a3c" stop-opacity="0"/></linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c63c0" stop-opacity=".55"/><stop offset="1" stop-color="#050a18" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M760 760 V430 Q760 250 960 250 Q1160 250 1160 430 V760 Z" fill="url(#gate)"/>
      <path d="M760 760 V430 Q760 250 960 250 Q1160 250 1160 430 V760" fill="none" stroke="#8fc2ff" stroke-opacity=".55" stroke-width="3"/>
      <path d="M690 760 V420 Q690 200 960 200 Q1230 200 1230 420 V760" fill="none" stroke="#5c9bf0" stroke-opacity=".35" stroke-width="2"/>
      <polygon points="780,0 1140,0 1500,760 420,760" fill="url(#beam)"/>
      <polygon points="900,0 1020,0 1180,760 740,760" fill="url(#beam)" opacity=".7"/>
      <rect x="0" y="0" width="150" height="800" fill="url(#pil)"/>
      <rect x="190" y="60" width="95" height="720" fill="url(#pil)" opacity=".85"/>
      <rect x="320" y="150" width="60" height="640" fill="url(#pil)" opacity=".6"/>
      <rect x="1770" y="0" width="150" height="800" fill="url(#pilr)"/>
      <rect x="1635" y="60" width="95" height="720" fill="url(#pilr)" opacity=".85"/>
      <rect x="1540" y="150" width="60" height="640" fill="url(#pilr)" opacity=".6"/>
      <rect x="0" y="760" width="1920" height="320" fill="url(#floor)"/>
      <g stroke="#6aa8ff" stroke-opacity=".28" stroke-width="2" fill="none">
        <path d="M0 780 H1920 M0 830 H1920 M0 900 H1920 M0 990 H1920"/>
        <path d="M960 760 L-200 1080 M960 760 L100 1080 M960 760 L460 1080 M960 760 L960 1080 M960 760 L1460 1080 M960 760 L1820 1080 M960 760 L2120 1080"/>
      </g>
      <rect x="0" y="758" width="1920" height="4" fill="#8fc2ff" opacity=".6"/>
    </svg>
    <i class="dust" style="left:12%;top:70%;--t:9s;--x:30px"></i><i class="dust" style="left:26%;top:45%;--t:11s;--x:-24px"></i><i class="dust" style="left:38%;top:80%;--t:8s;--x:18px"></i>
    <i class="dust" style="left:55%;top:60%;--t:12s;--x:-30px"></i><i class="dust" style="left:68%;top:78%;--t:10s;--x:26px"></i><i class="dust" style="left:82%;top:50%;--t:9.5s;--x:-18px"></i>
    <i class="dust" style="left:90%;top:72%;--t:13s;--x:22px"></i><i class="dust" style="left:47%;top:35%;--t:14s;--x:-26px"></i>
    <svg class="emb-l" viewBox="0 0 100 100"><use href="#crest"/></svg>
  </div>
  <div class="scene" id="scene"><h2 id="scTitle"></h2><div class="sub" id="scSub"></div><div class="line"></div><div class="big" id="scTime">05:00</div><div class="res" id="scRes"></div><div class="bkp" id="bkp"><div class="bkl" id="bkLA"></div><span class="bkn" id="bkNA"></span><b class="bks" id="bkSA"></b><i class="bkd">:</i><b class="bks" id="bkSB"></b><span class="bkn r" id="bkNB"></span><div class="bkl" id="bkLB"></div></div></div>
  <div class="sweep" id="sweep"></div>
</div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), st = null, offset = 0, prevA = null, prevB = null, prevScene = null, lastTime = '';
var ACC = {
  gold:{ g:'#4da3ff', g2:'#d6ebff', g3:'#1d4f91', gl:'rgba(77,163,255,.5)' },
  steel:{ g:'#a9bdd6', g2:'#f1f6fc', g3:'#4a5d77', gl:'rgba(170,195,230,.4)' },
  amber:{ g:'#c9a45c', g2:'#f2dca4', g3:'#6d5a2e', gl:'rgba(201,164,92,.45)' },
  rose:{ g:'#e0566c', g2:'#ffd0d7', g3:'#7a2335', gl:'rgba(224,86,108,.45)' }
};
function fit(){
  var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  cv.style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit); fit();

function mmss(s){ s = Math.max(0, s); var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function remaining(){
  var t = st.timer;
  return t.run ? Math.max(0, Math.ceil((t.endAt - (Date.now() + offset)) / 1000)) : t.rem;
}
function drawTimer(){
  if (!st) return;
  var r = remaining(), txt = mmss(r);
  if (txt !== lastTime){
    lastTime = txt;
    $('tVal').textContent = txt; $('scTime').textContent = txt;
    $('timer').classList.toggle('zero', r === 0);
  }
}
function render(){
  var a = ACC[st.accent] || ACC.gold, s = document.documentElement.style;
  s.setProperty('--gold', a.g); s.setProperty('--gold2', a.g2); s.setProperty('--gold3', a.g3); s.setProperty('--glow', a.gl);
  TM = {}; (st.teams || []).forEach(function(t){ TM[t.id] = t; });
  $('tnA').textContent = st.a.name || 'TBD'; fitText($('tnA'), 22, 11, 62); setLogo($('lgA'), st.a.teamId ? TM[st.a.teamId] : null, (st.a.tag || '').toUpperCase());
  $('tnB').textContent = st.b.name || 'TBD'; fitText($('tnB'), 22, 11, 62); setLogo($('lgB'), st.b.teamId ? TM[st.b.teamId] : null, (st.b.tag || '').toUpperCase());
  $('scA').textContent = st.a.score; $('scB').textContent = st.b.score;
  if (prevA !== null && st.a.score !== prevA) bump($('scA'));
  if (prevB !== null && st.b.score !== prevB) bump($('scB'));
  prevA = st.a.score; prevB = st.b.score;
  $('boT').textContent = 'BO' + st.bo; $('mapT').textContent = 'Карта ' + st.map;
  $('tkTour').textContent = st.tour; $('tkStage').textContent = st.stage;
  $('camName').textContent = st.cast; $('ltName').textContent = st.cast; $('ltRole').textContent = st.role;
  $('lt').classList.toggle('on', !!st.lt);
  $('tLabel').textContent = st.label;
  if (prevScene !== null && st.scene !== prevScene){
    var sw = $('sweep'); sw.classList.remove('go'); void sw.offsetWidth; sw.classList.add('go');
  }
  prevScene = st.scene;
  var sceneOn = st.scene === 'soon' || st.scene === 'break';
  $('scene').classList.toggle('on', sceneOn); $('sart').classList.toggle('on', sceneOn);
  $('scene').classList.toggle('isbreak', st.scene === 'break');
  $('bscene').classList.toggle('on', st.scene === 'bracket');
  $('sb').classList.toggle('hide', st.scene === 'soon' || st.scene === 'bracket');
  renderBracket();
  if (st.scene === 'soon'){ $('scTitle').textContent = 'Скоро начнём'; $('scSub').textContent = st.tour; $('scRes').textContent = st.stage; }
  if (st.scene === 'break'){
    $('scTitle').textContent = 'Перерыв'; $('scSub').textContent = st.tour + ' · BO' + st.bo + ' · Карта ' + st.map;
    $('scRes').textContent = 'Следующая карта: ' + Math.min(9, st.map + 1);
    $('bkNA').textContent = st.a.name || 'TBD'; $('bkNB').textContent = st.b.name || 'TBD';
    $('bkSA').textContent = st.a.score; $('bkSB').textContent = st.b.score;
    setLogo($('bkLA'), st.a.teamId ? TM[st.a.teamId] : null, (st.a.tag || '').toUpperCase());
    setLogo($('bkLB'), st.b.teamId ? TM[st.b.teamId] : null, (st.b.tag || '').toUpperCase());
    fitText($('bkNA'), 30, 14, 76); fitText($('bkNB'), 30, 14, 76);
  }
  drawTimer();
}
setInterval(drawTimer, 200);

/* ---------- значки команд ---------- */
var TM = {};
function initials(n){
  var w = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '';
  if (w.length === 1) return w[0].slice(0, 2).toUpperCase();
  return w.slice(0, 3).map(function(x){ return x[0]; }).join('').toUpperCase();
}
function fitText(el, base, min, maxH){
  var key = el.textContent + '|' + base;
  if (el.dataset.f === key) return;
  el.dataset.f = key;
  var size = base; el.style.fontSize = size + 'px';
  while ((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > maxH) && size > min){ size -= 1; el.style.fontSize = size + 'px'; }
}
function tagFont(len, base){ return Math.round(base * (len <= 2 ? 1 : len === 3 ? 0.88 : len === 4 ? 0.72 : 0.6)); }
function fitAll(){
  var f = document.querySelectorAll('.tn'), i;
  for (i = 0; i < f.length; i++){ f[i].dataset.f = ''; fitText(f[i], 22, 11, 62); }
  f = document.querySelectorAll('.bn');
  for (i = 0; i < f.length; i++){ f[i].dataset.f = ''; fitText(f[i], 26, 12, 50); }
}
function setLogo(el, team, fallback){
  var key = team && team.logo ? team.id + ':' + team.v : 'i:' + fallback;
  if (el.dataset.k === key) return;
  el.dataset.k = key; el.textContent = '';
  el.style.fontSize = el.classList.contains('bl') ? tagFont(fallback.length, 13) + 'px' : tagFont(fallback.length, 20) + 'px';
  if (team && team.logo){
    var img = new Image(); img.alt = ''; img.src = '/logo/' + team.id + '?v=' + encodeURIComponent(team.v);
    el.appendChild(img);
  } else {
    el.textContent = fallback;
  }
}

/* ---------- сетка плей-оффа ---------- */
var BW = 400, BH = 112;
var BR = {
  pi1:{x:40,y:356}, pi2:{x:40,y:520}, ubs1:{x:520,y:356}, ubs2:{x:520,y:520},
  ubf:{x:1000,y:438}, gf:{x:1480,y:601}, lbs:{x:520,y:764}, lbf:{x:1000,y:764}
};
var HEADS = [
  ['Плей-ин',40,290,'pi'], ['Верхняя сетка · полуфинал',520,290,'ubs'], ['Верхняя сетка · финал',1000,290,'ubf'], ['Гранд-финал',1480,290,'gf'],
  ['Нижняя сетка · полуфинал',520,700,'lbs'], ['Нижняя сетка · финал',1000,700,'lbf']
];
var LINKS = [['pi1','ubs1'],['pi2','ubs2'],['ubs1','ubf'],['ubs2','ubf'],['ubf','gf'],['lbf','gf'],['lbs','lbf']];
var bEls = {};
function buildBracket(){
  var host = $('bscene'), html = '', i;
  function colOf(x){ return Math.round((x - 40) / 480); }
  HEADS.forEach(function(h){
    html += '<div class="bh" style="left:' + h[1] + 'px;top:' + h[2] + 'px;--d:' + (0.2 + colOf(h[1]) * 0.12).toFixed(2) + 's"><span>' + h[0] + '</span><em id="bf_' + h[3] + '"></em></div>';
  });
  Object.keys(BR).forEach(function(id){
    var p = BR[id];
    var dly = (0.32 + colOf(p.x) * 0.12 + (p.y > 700 ? 0.08 : (p.y > 500 ? 0.04 : 0))).toFixed(2);
    html += '<div class="cut bm" style="left:' + p.x + 'px;top:' + p.y + 'px;--d:' + dly + 's"><div class="in">' +
      '<div class="br" id="b_' + id + '_a"><i class="bl"></i><span class="bn"></span><span class="bs"></span></div>' +
      '<div class="br" id="b_' + id + '_b"><i class="bl"></i><span class="bn"></span><span class="bs"></span></div></div></div>';
  });
  host.insertAdjacentHTML('beforeend', html);
  var segs = '', T = 3;
  function seg(cls, x, y, w, h, d){
    return '<div class="lk ' + cls + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;--d:' + d.toFixed(2) + 's"></div>';
  }
  LINKS.forEach(function(l){
    var s = BR[l[0]], t = BR[l[1]];
    var x1 = s.x + BW, y1 = s.y + BH / 2, x2 = t.x, y2 = t.y + BH / 2, xm = Math.round((x1 + x2) / 2);
    var d0 = 0.75 + colOf(s.x) * 0.1;
    if (y1 === y2){
      segs += seg('', x1, y1 - T / 2, x2 - x1, T, d0);
    } else {
      segs += seg('', x1, y1 - T / 2, xm - x1 + T / 2, T, d0);
      segs += seg(y2 > y1 ? 'v' : 'v vu', xm - T / 2, Math.min(y1, y2) - T / 2, T, Math.abs(y2 - y1) + T, d0 + 0.22);
      segs += seg('', xm, y2 - T / 2, x2 - xm, T, d0 + 0.44);
    }
  });
  $('blinks').innerHTML = segs;
  Object.keys(BR).forEach(function(id){
    ['a','b'].forEach(function(s){
      var row = $('b_' + id + '_' + s);
      bEls[id + s] = { row: row, l: row.children[0], n: row.children[1], sc: row.children[2] };
    });
  });
}
function renderBracket(){
  var b = st.bracket; if (!b) return;
  $('bTitle').textContent = b.title || ' ';
  $('bTour').textContent = st.tour;
  if (b.fmt) Object.keys(b.fmt).forEach(function(k){ var e = $('bf_' + k); if (e) e.textContent = 'BO' + b.fmt[k]; });
  Object.keys(BR).forEach(function(id){
    var m = b.m[id], A = m.a, B = m.b;
    [['a', A, B], ['b', B, A]].forEach(function(x){
      var e = bEls[id + x[0]], me = x[1], other = x[2];
      e.n.textContent = me.name || 'TBD'; fitText(e.n, 26, 12, 50);
      e.n.classList.toggle('empty', !me.name);
      var tm = me.teamId ? TM[me.teamId] : null;
      e.l.classList.toggle('tbd', !me.name);
      setLogo(e.l, tm, me.name ? (tm ? tm.tag.toUpperCase() : initials(me.name)) : '?');
      e.sc.textContent = (me.name || me.score) ? me.score : '';
      e.row.classList.toggle('win', me.score > other.score);
      e.row.classList.toggle('lose', me.score < other.score);
    });
  });
}
buildBracket();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (st) fitAll(); });

var wait = 500;
function connect(){
  var ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = function(e){
    var m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === 'state'){ st = m.state; offset = m.now - Date.now(); wait = 500; render(); }
  };
  ws.onclose = function(){ setTimeout(connect, wait); wait = Math.min(wait * 2, 8000); };
  ws.onerror = function(){ try { ws.close(); } catch (_) {} };
}
connect();
})();
</script>
